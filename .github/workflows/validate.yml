name: Validate analytics and source-backed explorer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    name: Reconcile SQL, Python and portfolio evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q portfolio scripts tests
      - name: Verify committed manifest integrity and explorer parity
        run: python -m unittest discover -s tests -v
      - name: Rebuild all five source-backed SQL analyses
        run: python -m portfolio.run
      - name: Verify regenerated manifest integrity and explorer parity
        run: python -m unittest discover -s tests -v
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: analytics-reconciliation-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/run_summary.json
            */Results/validation.json
            */Results/quality.json
            */Results/manifest.json
            */Results/additional_metrics.json
            demo/analytics-explorer.html

  secrets:
    name: Scan Git history for exposed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks binary
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo 'fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: Scan all reachable Git history
        run: /tmp/gitleaks git --no-banner --redact .
